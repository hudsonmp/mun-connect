service: document-processor-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.9
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 3008
  timeout: 180
  logRetentionInDays: 14
  
  environment:
    S3_BUCKET: ${self:custom.bucket}
    USE_S3: true
    LOG_LEVEL: INFO
    XRAY_ENABLED: ${self:custom.xrayEnabled, 'false'}
    PYTHONPATH: /var/task:/var/task/lib
    TEST_ENV: ${opt:test, 'false'}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:ListBucket
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:custom.bucket}
            - arn:aws:s3:::${self:custom.bucket}/*
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: "*"
  
  tracing:
    apiGateway: ${self:custom.xrayEnabled, 'false'}
    lambda: ${self:custom.xrayEnabled, 'false'}

custom:
  bucket: doc-processor-${self:provider.stage}
  xrayEnabled: ${opt:xray, 'false'}
  
  pythonRequirements:
    dockerizePip: true
    slim: true
    layer: true
    useDownloadCache: true
    useStaticCache: true
    zip: true
    slimPatternsAppendDefaults: true
    slimPatterns:
      - '**/*.egg-info*'
      - '**/*.dist-info*'
      - '**/__pycache__/**'
  
  prune:
    automatic: true
    includeLayers: true
  
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
      - 'application/pdf'
      - 'application/octet-stream'
    minimumCompressionSize: 1024

functions:
  api:
    handler: api.lambda_handler
    events:
      - http:
          path: /process
          method: post
          cors: true
      - http:
          path: /process-batch
          method: post
          cors: true
      - http:
          path: /download/{filename}
          method: get
          cors: true
          request:
            parameters:
              paths:
                filename: true
      - http:
          path: /health
          method: get
          cors: true

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin

package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.env*'
    - '!.git*'
    - '!.pytest_cache/**'
    - '!__pycache__/**'
    - '!.venv/**'
    - '!.vscode/**'
    - '!*.pyc'
    - '!tests/**'
    - '!README.md'
    - 'api.py'
    - 'config.py'
    - 'document_processing_pipeline.py'
    - 'pdf_processor.py'
    - 'metadata_extractor.py'
    - 'linguistic_features.py'
    - 'bert_formatter.py'
    - 'argumentation_analyzer.py'

resources:
  Resources:
    DocumentProcessorBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucket}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              AllowedOrigins:
                - '*'
              MaxAge: 3600
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true 